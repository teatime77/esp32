[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../lib/protocol
    symlink://../../lib/servo
    symlink://../../lib/imu
    symlink://../../lib/ble
    symlink://../../lib/wifi
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
monitor_dtr = 1
monitor_rts = 0
