[platformio]
default_envs = supermini_esp32s3

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../lib/protocol
    symlink://../../lib/servo
    symlink://../../lib/imu
    symlink://../../lib/ble
    symlink://../../lib/wifi
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
monitor_dtr = 1
monitor_rts = 0

[env:supermini_esp32s3]
; SuperMiniの4MB Flashを想定し、PSRAMは使用しない。
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.flash_mode = dio
monitor_dtr = 1
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -D UROA_BOARD_SUPERMINI_ESP32S3=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
